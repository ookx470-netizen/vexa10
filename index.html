    <script>
      (function() {
        var origFetch = window.fetch;
        window.fetch = async function() {
          var response = await origFetch.apply(this, arguments);
          try {
            var url = typeof arguments[0] === 'string' ? arguments[0] : (arguments[0] && arguments[0].url) || '';
            if (url.indexOf('/api/auth/login') !== -1) {
              var clone = response.clone();
              clone.json().then(function(data) {
                if (data && data.success && (data.isAdmin || (data.user && data.user.role === 'admin'))) {
                  sessionStorage.setItem('vexa_admin_logged', 'true');
                  if (data.token) {
                    localStorage.setItem('vexa_auth_token', data.token);
                  }
                  window.location.href = data.redirectUrl || '/admin';
                }
              }).catch(function() {});
            }
          } catch(e) {}
          return response;
        };
      })();
    </script>
